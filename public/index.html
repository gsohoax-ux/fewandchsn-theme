<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memecoin Bot</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b0d11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memecoin Bot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ============================================================ design tokens */
:root {
  --bg: #0b0d11; --surface: #11141a; --surface-2: #161a22; --surface-3: #1c212b; --border: #232a36; --border-strong: #2f3846;
  --text: #e6e9ef; --text-2: #b4bbca; --muted: #828b9e; --faint: #5b6478;
  --accent: #6d8dff; --accent-soft: rgba(109,141,255,.14);
  --up: #26c281; --up-soft: rgba(38,194,129,.13); --down: #ef5a5a; --down-soft: rgba(239,90,90,.13);
  --warn: #e2b340; --warn-soft: rgba(226,179,64,.13); --info: #59a8d8;
  --radius: 10px; --radius-sm: 6px; --gap: 14px;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --side-w: 228px; --top-h: 56px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13.5px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); }
.up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); } .muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 12px; } .tiny { font-size: 11px; } .b { font-weight: 600; }
[hidden] { display: none !important; }

/* ============================================================ layout */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
.brand { display: flex; align-items: center; gap: 10px; height: var(--top-h); padding: 0 18px; border-bottom: 1px solid var(--border); font-weight: 650; letter-spacing: .2px; }
.brand img { width: 24px; height: 24px; border-radius: 6px; }
.brand small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; letter-spacing: .3px; }
.nav { padding: 12px 10px; overflow: auto; flex: 1; }
.nav .grp { margin-bottom: 10px; }
.nav .top { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-2); font-weight: 600; text-align: left; }
.nav .top svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav .top:hover { background: var(--surface-2); color: var(--text); }
.nav .top.on { background: var(--accent-soft); color: var(--text); }
.nav .sub { display: flex; flex-direction: column; margin: 2px 0 0 27px; border-left: 1px solid var(--border); }
.nav .sub button { border: 0; background: none; text-align: left; padding: 5px 12px; color: var(--muted); cursor: pointer; font-size: 12.5px; border-left: 2px solid transparent; margin-left: -1px; }
.nav .sub button:hover { color: var(--text); }
.nav .sub button.on { color: var(--text); border-left-color: var(--accent); }
.side-foot { padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); font-size: 11px; color: var(--faint); }
.side-foot a { color: var(--muted); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; height: calc(var(--top-h) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 20px 0; background: rgba(11,13,17,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
.topbar h1 { font-size: 15px; margin: 0; font-weight: 650; white-space: nowrap; }
.topbar h1 span { color: var(--muted); font-weight: 500; }
.search { flex: 1 1 320px; max-width: 520px; position: relative; margin-left: auto; }
.search input { width: 100%; height: 34px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 0 12px 0 32px; font-family: var(--mono); font-size: 12px; outline: none; }
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 10px; top: 9px; width: 15px; height: 15px; color: var(--faint); }
.status { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; overflow: hidden; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--faint); flex: none; }
.dot.ok { background: var(--up); box-shadow: 0 0 0 3px var(--up-soft); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--down); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: 11.5px; white-space: nowrap; }
.chip.demo { background: var(--warn); color: #1a1400; border-color: var(--warn); font-weight: 650; }
.content { padding: 18px 20px 40px; max-width: 1680px; width: 100%; margin: 0 auto; }
.subtabs { display: none; }
.bottomnav { display: none; }

/* ============================================================ components */
.grid { display: grid; gap: var(--gap); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1fr) 360px; }
.g-trade { grid-template-columns: minmax(0, 1fr) 340px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; }
.card > header { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--border); min-height: 44px; }
.card > header h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--text-2); margin: 0; font-weight: 650; }
.card > header .meta { margin-left: auto; color: var(--muted); font-size: 11.5px; text-align: right; }
.card .body { padding: 14px; }
.card .body.tight { padding: 0; }
.section-title { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 12px; }
.section-title h2 { margin: 0; font-size: 18px; font-weight: 650; }
.section-title p { margin: 0; color: var(--muted); font-size: 12.5px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin-bottom: var(--gap); }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 14px; min-width: 0; }
.kpi small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi b { display: block; font: 600 20px/1.3 var(--mono); margin-top: 3px; white-space: nowrap; }
.kpi span { display: block; color: var(--faint); font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.t { width: 100%; border-collapse: collapse; }
.t th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
.t td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
.t td.wrap { white-space: normal; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr.click { cursor: pointer; } .t tbody tr.click:hover td { background: var(--surface-2); }
.t .r { text-align: right; }
.scroll-x { overflow-x: auto; }
.list { list-style: none; margin: 0; padding: 0; }
.list > li { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.list > li:last-child { border-bottom: 0; }
.empty { padding: 26px 14px; text-align: center; color: var(--muted); font-size: 12.5px; }
.tag { display: inline-flex; align-items: center; height: 19px; padding: 0 6px; border-radius: 4px; font-size: 10.5px; font-weight: 650; letter-spacing: .3px; border: 1px solid var(--border-strong); color: var(--text-2); white-space: nowrap; vertical-align: middle; }
.tag.up { color: var(--up); border-color: rgba(38,194,129,.4); background: var(--up-soft); }
.tag.down { color: var(--down); border-color: rgba(239,90,90,.4); background: var(--down-soft); }
.tag.warn { color: var(--warn); border-color: rgba(226,179,64,.4); background: var(--warn-soft); }
.tag.info { color: var(--accent); border-color: rgba(109,141,255,.4); background: var(--accent-soft); }
.tag.solid-up { background: var(--up); color: #04150c; border-color: var(--up); }
.tag.solid-down { background: var(--down); color: #fff; border-color: var(--down); }
.v-SAFE { color: var(--up); } .v-CAUTION { color: var(--warn); } .v-AVOID { color: var(--down); } .v-UNVERIFIED { color: var(--muted); }
.score { display: inline-grid; place-items: center; min-width: 34px; height: 22px; padding: 0 5px; border-radius: 5px; font: 650 12px var(--mono); color: #071009; }
.s-g { background: var(--up); } .s-y { background: var(--warn); } .s-n { background: #4b5366; color: #fff; } .s-r { background: var(--down); color: #fff; }
.bar { height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); cursor: pointer; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); } .btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.buy { background: var(--up); border-color: var(--up); color: #04150c; }
.btn.sell { background: var(--down); border-color: var(--down); color: #fff; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 11.5px; border-radius: 6px; }
.btn.ghost { background: none; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 12px; color: var(--muted); cursor: pointer; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--surface-3); color: var(--text); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.input { height: 32px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 0 10px; outline: none; min-width: 0; width: 100%; }
.input:focus { border-color: var(--accent); }
.input.mono { font-family: var(--mono); font-size: 12px; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.notice { border-radius: 8px; padding: 10px 12px; font-size: 12.5px; border: 1px solid; }
.notice.warn { border-color: rgba(226,179,64,.4); background: var(--warn-soft); color: #f0d68e; }
.notice.info { border-color: rgba(109,141,255,.35); background: var(--accent-soft); color: #c4d0ff; }
.notice.bad { border-color: rgba(239,90,90,.4); background: var(--down-soft); color: #ffc2c2; }
.cond { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.cond li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; padding: 3px 0; align-items: start; }
.cond .ic { font: 700 12px var(--mono); text-align: center; }
.cond .ok .ic { color: var(--up); } .cond .no .ic { color: var(--down); } .cond .na .ic { color: var(--faint); }
.cond small { display: block; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px 16px; }
.kv > div small { display: block; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; }
.kv > div b { font: 600 13.5px var(--mono); }
details > summary { cursor: pointer; color: var(--accent); font-size: 12.5px; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; align-items: center; }

/* board */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.board .col { border-right: 1px solid var(--border); min-width: 0; }
.board .col:last-child { border-right: 0; }
.board .col h3 { margin: 0; padding: 9px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--border); border-top: 2px solid; }
.board .c-new h3 { border-top-color: var(--info); color: var(--info); } .board .c-mid h3 { border-top-color: var(--faint); color: var(--text-2); } .board .c-final h3 { border-top-color: var(--up); color: var(--up); }
.board ul { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow: auto; }
.board li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
.board li:hover { background: var(--surface-2); }
.board .sym { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board .sub { color: var(--muted); font-size: 11px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { display: inline-block; width: 46px; height: 4px; border-radius: 2px; background: var(--surface-3); vertical-align: middle; margin-right: 4px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--up); }
.ticker { display: flex; gap: 18px; overflow-x: auto; white-space: nowrap; padding: 9px 14px; scrollbar-width: none; font-size: 12.5px; }
.ticker::-webkit-scrollbar { display: none; }
.ticker a { color: var(--text); }

/* logger */
.log { list-style: none; margin: 0; padding: 0; max-height: 380px; overflow: auto; font: 11.5px/1.5 var(--mono); }
.log li { padding: 4px 14px; border-bottom: 1px solid var(--border); }
.log .a { font-weight: 700; margin-right: 6px; }
.a-FILTER { color: #f39c4a; } .a-ANALYST { color: #a990ff; } .a-ALERT { color: var(--up); } .a-EXECUTOR { color: #4cd6c0; } .a-RISK { color: #d27bff; } .a-COPY { color: #f78fd4; } .a-WATCH { color: var(--warn); } .a-RADAR { color: var(--info); }
.l-bad { color: var(--down); } .l-good { color: var(--up); } .l-muted { color: var(--muted); }

/* chart */
.chart-head { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-end; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.chart-head .tk { font-size: 17px; font-weight: 700; }
.chart-head .px { font: 600 22px var(--mono); }
.chart-head .stat small { display: block; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; }
.chart-head .stat b { font: 600 13px var(--mono); }
.chart-tools { display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.chart-wrap { position: relative; height: 520px; }
.chart-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; }
.chart-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; pointer-events: none; }
.chart-foot { display: flex; justify-content: space-between; gap: 10px; padding: 7px 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); flex-wrap: wrap; }

/* positions */
.pos { border-bottom: 1px solid var(--border); padding: 12px 14px; }
.pos:last-child { border-bottom: 0; }
.pos-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.pos-top .tk { font-weight: 700; font-size: 14px; cursor: pointer; }
.pos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px 14px; }
.pos-grid small { display: block; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; }
.pos-grid b { font: 600 13px var(--mono); }
.pos-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); }
.pos-risk { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.flash-up { animation: fu .9s; } .flash-down { animation: fd .9s; }
@keyframes fu { from { background: var(--up-soft); } to { background: transparent; } }
@keyframes fd { from { background: var(--down-soft); } to { background: transparent; } }
.kf { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.kf .box { border: 1px solid var(--border); border-left-width: 3px; border-radius: 8px; padding: 10px 12px; background: var(--surface-2); }
.kf .box h4 { margin: 0 0 6px; font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; }
.kf .box.bad { border-left-color: var(--down); } .kf .box.warn { border-left-color: var(--warn); } .kf .box.ok { border-left-color: var(--up); } .kf .box.unknown { border-left-color: var(--faint); }
.checks { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.checks li { padding: 2px 0 2px 18px; position: relative; }
.checks li::before { position: absolute; left: 0; font: 700 11px var(--mono); }
.checks .lv-ok::before { content: "✓"; color: var(--up); } .checks .lv-warn::before { content: "!"; color: var(--warn); }
.checks .lv-bad::before { content: "✕"; color: var(--down); } .checks .lv-info::before { content: "i"; color: var(--info); } .checks .lv-unknown::before { content: "?"; color: var(--faint); }
.verdict { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 6px; font-weight: 750; letter-spacing: .6px; }
.verdict.SAFE { background: var(--up); color: #04150c; } .verdict.CAUTION { background: var(--warn); color: #1a1400; } .verdict.AVOID { background: var(--down); color: #fff; } .verdict.UNVERIFIED { background: #4b5366; color: #fff; }

/* dialog */
dialog { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: 12px; width: min(720px, calc(100vw - 24px)); padding: 0; }
dialog::backdrop { background: rgba(0,0,0,.6); }
.dlg-h { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.dlg-b { padding: 6px 16px 16px; max-height: 74vh; overflow: auto; }
.dlg-b h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 18px 0 6px; }
.x { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; }
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; max-width: 360px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.toast.bad { border-color: var(--down); } .toast.good { border-color: var(--up); }
.disclaimer { color: var(--faint); font-size: 11.5px; text-align: center; padding: 18px 0 0; }

/* ============================================================ responsive */
@media (max-width: 1280px) { .g-main { grid-template-columns: minmax(0, 1fr) 320px; } }
@media (max-width: 1100px) { .g-main, .g-trade, .g3 { grid-template-columns: minmax(0, 1fr); } .board { grid-template-columns: 1fr; } .board .col { border-right: 0; border-bottom: 1px solid var(--border); } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { padding: env(safe-area-inset-top) 16px 0; gap: 10px; }
  .topbar .status { display: none; }
  .search { max-width: none; }
  .content { padding: 12px 16px calc(84px + env(safe-area-inset-bottom)); }
  .subtabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top)); z-index: 15; }
  .subtabs::-webkit-scrollbar { display: none; }
  .subtabs button { border: 1px solid var(--border); background: none; border-radius: 99px; padding: 5px 12px; font-size: 12px; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .subtabs button.on { background: var(--accent-soft); color: var(--text); border-color: rgba(109,141,255,.5); }
  .bottomnav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(17,20,26,.97); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
  .bottomnav button { border: 0; background: none; color: var(--muted); padding: 8px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; cursor: pointer; }
  .bottomnav svg { width: 20px; height: 20px; }
  .bottomnav button.on { color: var(--text); }
  .bottomnav button.on svg { color: var(--accent); }
